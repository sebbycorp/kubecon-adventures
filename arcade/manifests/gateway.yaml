# The arcade's front door and LLM gateway. agentgateway creates a proxy Deployment and
# a LoadBalancer Service named "arcade" (MetalLB IP on the kind network).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: arcade
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
