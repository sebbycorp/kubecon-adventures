# The games' shared model: Flappy Substrate, Pod Packer and Substrate Selfie use duck-model;
# Cluster Defense, Gateway Defense and Agent Flow have their own ModelConfigs on its
# duck-llm Secret. The names are left over from Duck Hunt (removed) so running agents
# don't change.
apiVersion: v1
kind: Secret
metadata:
  name: duck-llm
  namespace: kagent
stringData:
  # Placeholder; agentgateway replaces it with the real OpenAI key.
  OPENAI_API_KEY: via-agentgateway
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: duck-model
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: duck-llm
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://arcade.agentgateway-system.svc.cluster.local/v1
