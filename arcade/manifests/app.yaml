# The arcade backend (all games, the front page and shared stats), behind the agentgateway
# "arcade" Gateway. One replica: game state (players, ducks, timers) lives in memory.
apiVersion: v1
kind: Namespace
metadata:
  name: arcade
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade
  namespace: arcade
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arcade
  template:
    metadata:
      labels:
        app: arcade
    spec:
      containers:
      - name: arcade
        image: IMAGE   # set by deploy.sh
        args: ["-idle", "20"]
        env: # set by deploy.sh
        - name: CLUSTER_NODES
          value: "NODES"
        - name: HOST_CPUS
          value: "CPUS"
        - name: HOST_MEM_GIB
          value: "MEMGIB"
        - name: HEIST_NODES      # Substrate Siege's districts: the cluster's nodes
          value: "HEIST_NODES"
        - name: DISABLED_GAMES   # games left out of this deploy (SKIP_GAMES)
          value: "DISABLED_GAMES"
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: arcade
  namespace: arcade
spec:
  selector:
    app: arcade
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arcade
  namespace: arcade
spec:
  parentRefs:
  - name: arcade
    namespace: agentgateway-system
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: arcade
      port: 80
    timeouts:
      request: 0s   # Server-Sent Events stay open
