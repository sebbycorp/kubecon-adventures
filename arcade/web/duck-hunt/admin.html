<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hunt admin</title>
<style>
  body { margin: 0; padding: 20px; background: #0d0e0f; color: #e8e8e8; font: 14px/1.5 Inter, system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid #ff6b6b; background: #2a1212; color: #ffd0d0; font: inherit; cursor: pointer; }
  pre { background: #121314; border: 1px solid #2a2d30; border-radius: 10px; padding: 12px; overflow: auto; max-height: 75vh; font-size: 12px; }
  a { color: #5fd068; }
</style>
</head>
<body>
<h1>Agent Hunt admin · <a href="/duck-hunt/screen">big screen</a> · <a href="/duck-hunt">phone</a></h1>
<p><button id="reset">Reset leaderboard and end every run</button> <span id="msg"></span></p>
<pre id="state">Loading…</pre>
<script>
const $ = (id) => document.getElementById(id);
async function load() { try { $("state").textContent = JSON.stringify(await (await fetch("/admin/duck-hunt/api/state")).json(), null, 2); } catch (e) { $("state").textContent = String(e); } }
$("reset").onclick = async () => {
  if (!confirm("Clear the Agent Hunt leaderboard and end every run?")) return;
  const r = await fetch("/admin/duck-hunt/api/reset", { method: "POST" });
  $("msg").textContent = r.ok ? "Done." : "Failed: " + r.status;
  load();
};
load();
setInterval(load, 3000);
</script>
</body>
</html>
