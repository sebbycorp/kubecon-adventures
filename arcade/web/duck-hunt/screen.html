<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Hunt Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nes.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(300px, 24vw); }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; }
  #sky { width: 100%; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  #panel { overflow: hidden; display: flex; flex-direction: column; font-size: 10px; padding: 4px 4px 4px 0; }
  #panel .box { margin: 10px 10px 6px; padding: 10px; }
  #panel h2 { font-size: 10px; margin: 0 0 8px; color: var(--orange); font-weight: normal; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 18px; }
  #qr { background: #fff; padding: 8px; width: fit-content; margin: 6px auto; }
  #qr img, #qr canvas { display: block; width: 150px; height: 150px; image-rendering: pixelated; }
  #joinurl { text-align: center; font-size: 8px; word-break: break-all; color: var(--sky); }
  #ticker { font-size: 8px; line-height: 1.9; flex: 1; min-height: 0; overflow: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: rgba(0,0,0,.85); cursor: pointer; z-index: 5; text-align: center; gap: 24px; }
  #start .title { font-size: 48px; }
</style>
</head>
<body>
<div id="stage"><canvas id="sky" width="480" height="270" aria-label="Duck Hunt sky with every player's duck"></canvas></div>

<aside id="panel">
  <div class="box" style="text-align:center">
    <h2>SCAN TO PLAY</h2>
    <div id="qr"></div>
    <div id="joinurl"></div>
  </div>
  <div class="box">
    <h2>DUCKS</h2>
    <div class="row"><span>FLYING</span><span class="big green" id="flying">0</span></div>
    <div class="row"><span>DOWN</span><span class="big red" id="down">0</span></div>
    <div class="row muted"><span>PLAYERS</span><span id="players">0</span></div>
  </div>
  <div class="box">
    <h2>AGENT SUBSTRATE</h2>
    <div class="row"><span>SANDBOXES AWAKE</span><span class="big yellow" id="awake">0</span></div>
    <div class="row"><span>ASLEEP AS SNAPSHOTS</span><span class="big" id="asleep">0</span></div>
    <canvas id="spark" width="240" height="28" style="width:100%;height:28px;margin:6px 0"></canvas>
    <div class="muted" style="font-size:7px;margin:-2px 0 8px">AWAKE, LAST 60S · ZZ = SNAPSHOT ON DISK</div>
    <div class="row"><span>WAKE-UPS / PEAK</span><span><span id="wakeups">0</span> / <span id="peak">0</span></span></div>
    <div class="row"><span>SNAPSHOT</span><span class="yellow" id="t-snapshot">--</span></div>
    <div class="row"><span>RESTORE</span><span class="yellow" id="t-restore">--</span></div>
    <div class="row"><span>HATCH</span><span id="t-hatch">--</span></div>
  </div>
  <div class="box">
    <h2>AGENTGATEWAY</h2>
    <div class="row"><span>LLM CALLS</span><span id="calls">0</span></div>
    <div class="row"><span>TOKENS</span><span id="tokens">0</span></div>
  </div>
  <div class="box" id="ticker"></div>
</aside>

<div id="start" role="button" tabindex="0">
  <div class="title">DUCK HUNT</div>
  <div class="sub">AGENT SUBSTRATE EDITION</div>
  <div class="blink">PUSH START</div>
  <div class="muted" style="font-size:8px">CLICK TO ENABLE SOUND</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/sprites.js"></script>
<script src="/duck-hunt/static/sky.js"></script>
<script>
// Show script errors in the ticker so a broken booth screen is easy to diagnose.
window.addEventListener("error", (e) => {
  const t = document.getElementById("ticker");
  if (t) t.insertAdjacentHTML("afterbegin", `<div class="red">ERR ${String(e.message).replace(/</g, "&lt;")} @${e.lineno}</div>`);
});
</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

// ---- join QR --------------------------------------------------------------
const joinURL = params.get("url") || location.origin + "/duck-hunt";
$("joinurl").textContent = joinURL.replace(/^https?:\/\//, "");
if (window.QRCode) new QRCode($("qr"), { text: joinURL, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });

// ---- side panel -----------------------------------------------------------
function ticker(html) {
  const el = $("ticker"), div = document.createElement("div");
  div.innerHTML = html;
  el.prepend(div);
  while (el.children.length > 14) el.lastChild.remove();
}

function pct(t) { return t ? `${fmtMs(t.p50)}<span class="muted"> P95 ${fmtMs(t.p95)}</span>` : "--"; }

function sparkline(history) {
  const c = $("spark"), g = c.getContext("2d"), max = Math.max(4, ...history);
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  history.forEach((v, i) => {
    const h = Math.round((v / max) * (c.height - 2));
    g.fillStyle = "#f8b800"; g.fillRect(i * (c.width / 60), c.height - h, Math.ceil(c.width / 60) - 1, h);
  });
}

function renderPanel(s) {
  const ducks = s.ducks || [], a = s.awake || {};
  $("flying").textContent = ducks.filter((d) => d.state === "flying").length;
  $("down").textContent = ducks.filter((d) => d.state === "shot" || d.state === "reviving").length;
  $("players").textContent = s.players;
  $("awake").textContent = a.now ?? 0;
  $("asleep").textContent = a.asleep ?? 0;
  $("wakeups").textContent = a.wakeUps ?? 0;
  $("peak").textContent = a.peak ?? 0;
  sparkline(a.history || []);
  $("t-snapshot").innerHTML = pct(s.timings.snapshot);
  $("t-restore").innerHTML = pct(s.timings.restore);
  $("t-hatch").innerHTML = pct(s.timings.hatch);
  $("calls").textContent = s.llmCalls;
  $("tokens").textContent = (s.tokens.inputTokens + s.tokens.outputTokens).toLocaleString();
}

const sky = startSky(document.getElementById("sky"), { intro: params.has("autostart"), narrate: true, onState: renderPanel, onTicker: ticker });

$("start").onclick = $("start").onkeydown = () => { Sfx.enable(); $("start").remove(); sky.intro(); };
// Kiosk mode: ?autostart skips the title card (browsers keep sound off until a click).
if (params.has("autostart")) $("start").remove();
</script>
</body>
</html>
