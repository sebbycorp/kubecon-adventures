<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fork Frenzy Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nes.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(320px, 26vw); }
  #stage { display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; }
  #lab { width: 100%; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  #panel { overflow: hidden; display: flex; flex-direction: column; font-size: 10px; padding: 4px 4px 4px 0; }
  #panel .box { margin: 10px 10px 6px; padding: 10px; }
  #panel h2 { font-size: 10px; margin: 0 0 8px; color: var(--orange); font-weight: normal; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .big { font-size: 20px; }
  #qr { background: #fff; padding: 8px; width: fit-content; margin: 6px auto; }
  #qr img, #qr canvas { display: block; width: 140px; height: 140px; image-rendering: pixelated; }
  #joinurl { text-align: center; font-size: 8px; word-break: break-all; color: var(--sky); }
  #lesson, #ticker { font-size: 8px; line-height: 1.9; }
  #lesson { color: var(--gray); }
</style>
</head>
<body>
<div id="stage"><canvas id="lab" width="480" height="270" aria-label="The cloning lab: every player's agent, its checkpoint, and its clones"></canvas></div>
<aside id="panel">
  <div class="box" style="text-align:center"><h2>SCAN TO PLAY</h2><div id="qr"></div><div id="joinurl"></div></div>
  <div class="box">
    <h2>FORK FRENZY</h2>
    <div class="row"><span>CLONES FORKED</span><span class="big green" id="forks">0</span></div>
    <div class="row"><span>CHECKPOINT P50</span><span class="yellow" id="t-checkpoint">--</span></div>
    <div class="row"><span>FORK P50</span><span class="yellow" id="t-fork">--</span></div>
    <div class="row muted"><span>FAMILIES</span><span id="families">0</span></div>
  </div>
  <div class="box"><h2>HOW IT WORKS</h2><div id="lesson"></div></div>
  <div class="box" style="flex:1;min-height:0;overflow:hidden"><h2>LIVE</h2><div id="ticker"></div></div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/sprites.js"></script>
<script src="/fork-frenzy/static/lab.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const joinURL = params.get("url") || location.origin + "/fork-frenzy";
$("joinurl").textContent = joinURL.replace(/^https?:\/\//, "");
if (window.QRCode) new QRCode($("qr"), { text: joinURL, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LESSONS = [
  "A CHECKPOINT SAVES AN AGENT'S SANDBOX SNAPSHOT AND CONVERSATION AS AN IMMUTABLE AGENT SUBSTRATE TAG.",
  "A FORK IS A NEW KAGENT SESSION AND A NEW SUBSTRATE ACTOR, STARTED FROM THAT TAG. IT TAKES MILLISECONDS.",
  "EVERY ORB IS A MEMORY. CLONES INHERIT EVERY ORB IN THE SNAPSHOT PHOTO. ORBS AFTER THE WHITE NOTCH ARE THEIR OWN TIMELINE.",
  "TUBE LAMPS: GREEN = SANDBOX AWAKE ON A WORKER. RED = IDLE, SNAPSHOTTED AND SUSPENDED. IT WAKES WHEN YOU TALK TO IT.",
  "USE IT FOR WHAT-IFS: BRANCH AN AGENT MID-TASK, TRY THREE APPROACHES, KEEP THE BEST ONE.",
];
let lesson = 0;
const showLesson = () => { $("lesson").textContent = LESSONS[lesson++ % LESSONS.length]; };
showLesson(); setInterval(showLesson, 8000);
function ticker(html) { const d = document.createElement("div"); d.innerHTML = html; $("ticker").prepend(d); while ($("ticker").children.length > 12) $("ticker").lastChild.remove(); }
function onState(s) {
  $("forks").textContent = s.forks; $("families").textContent = (s.families || []).length;
  $("t-checkpoint").textContent = s.timings?.checkpoint ? fmtMs(s.timings.checkpoint.p50) : "--";
  $("t-fork").textContent = s.timings?.fork ? fmtMs(s.timings.fork.p50) : "--";
}
function onEvent(e) {
  const n = `<span class="yellow">${esc(e.nick.toUpperCase())}</span>`;
  if (e.type === "teach") ticker(`${n} TAUGHT A SECRET: “${esc(e.text.toUpperCase())}”`);
  if (e.type === "checkpoint") ticker(`${n} CHECKPOINTED FORKY IN <span class="green">${fmtMs(e.ms)}</span>`);
  if (e.type === "fork") ticker(`${n} FORKED A CLONE IN <span class="green">${fmtMs(e.ms)}</span>`);
}
startLab($("lab"), { rows: 3, onState, onEvent });
document.addEventListener("click", () => Sfx.enable(), { once: true });
</script>
</body>
</html>
