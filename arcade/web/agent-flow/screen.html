<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0e0f; --grid: #17191b; --fg: #e8e8e8; --mute: #8a8f94; --green: #5fd068; --greenDim: #3d7a45; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 Inter, system-ui, sans-serif; height: 100%; overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, var(--bg) 100%); }
  .ui { position: fixed; z-index: 2; }
  #title { left: 32px; top: 28px; }
  #title img { height: 34px; display: block; margin-bottom: 10px; }
  #title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  #title p { margin: 4px 0 0; color: var(--mute); font-size: 13px; }
  #stats { right: 28px; top: 28px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 560px; }
  .stat { border: 1px solid #2a2d30; background: #121314ee; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--mute); }
  .stat b { color: var(--fg); font-weight: 600; margin-right: 4px; }
  #feed { right: 28px; bottom: 28px; width: 400px; display: flex; flex-direction: column; gap: 8px; }
  .ev { border: 1px solid #2a2d30; background: #121314ee; border-radius: 10px; padding: 9px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; animation: in .35s ease; }
  .ev.hook { border-color: var(--green); box-shadow: 0 0 30px #5fd06822; }
  .ev.bad { border-color: #8a3a3a; }
  .ev b { font-weight: 600; flex: none; }
  .ev span { color: #c3c7cb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev code { margin-left: auto; padding-left: 8px; color: var(--green); font: 12px ui-monospace, monospace; flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 22px; height: 22px; border-radius: 50%; background: #2c3c63; display: grid; place-items: center; font-size: 11px; flex: none; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  #qr { left: 32px; bottom: 28px; display: flex; gap: 14px; align-items: center; border: 1px solid var(--greenDim); border-radius: 14px; padding: 12px 18px 12px 12px; background: #111412; box-shadow: 0 0 40px #5fd06814; }
  #qr .code { width: 112px; height: 112px; background: #fff; border-radius: 6px; padding: 6px; box-sizing: border-box; }
  #qr .code img, #qr .code svg { width: 100%; height: 100%; display: block; position: static; }
  #qr b { display: block; font-size: 16px; }
  #qr span { color: var(--mute); font-size: 12.5px; }
  #qr .ask { display: block; margin-top: 6px; color: var(--green); font-size: 12.5px; min-height: 1.4em; transition: opacity .4s; }

  /* Ambient life: a slow light sweep and drifting sparks behind the map. */
  #sweep { position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 30% 40%, #5fd06812, transparent 30%), radial-gradient(circle at 70% 60%, #7c3aed10, transparent 32%);
    animation: sweep 22s ease-in-out infinite alternate; }
  @keyframes sweep { to { transform: translate(8%, -6%) rotate(8deg); } }
  body { background: var(--bg); } svg#scene { z-index: 0; }
  .spark { position: fixed; z-index: 0; width: 3px; height: 3px; border-radius: 50%; background: var(--green); opacity: 0; pointer-events: none; animation: drift linear infinite; }
  @keyframes drift { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .3; } 85% { opacity: .2; } 100% { opacity: 0; transform: translateY(-160px); } }

  #live { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--mute); border: 1px solid #2a2d30; background: #121314ee; border-radius: 999px; padding: 5px 12px 5px 10px; }
  #live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: beat 1.4s ease-in-out infinite; }
  #live b { color: var(--fg); font-weight: 600; letter-spacing: .06em; }
  @keyframes beat { 50% { transform: scale(.6); opacity: .5; } }
  .stat { transition: border-color .6s, box-shadow .6s; }
  .stat.bump { border-color: var(--green); box-shadow: 0 0 22px #5fd06844; }
  .stat.bump b { color: var(--green); }
  .av { color: #0d0e0f; font-weight: 700; }

  #toasts { left: 50%; top: 26px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--greenDim); background: #0f1a12e8; box-shadow: 0 0 24px #5fd06822; font-size: 13px; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  .toast.bad { border-color: #ef4444; background: #2a1010f0; box-shadow: 0 0 28px #ef444444; }
  .toast.hook { border-color: #a78bfa; background: #1a1430f0; box-shadow: 0 0 40px #7c3aed44; }
  .toast b { font-weight: 600; }
  .toast.out { animation: fade .5s forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(.9); } }
  @keyframes fade { to { opacity: 0; transform: translateY(-10px); } }

  /* The story card: follows the focused request, like Tessl's review/remediation cards. */
  #story { right: 28px; top: 50%; width: 380px; transform: translateY(-58%); border: 1px solid var(--greenDim); border-radius: 14px; background: #101311f2;
    box-shadow: 0 0 60px #5fd06818; padding: 14px 16px; transition: opacity .5s, transform .5s; }
  #story.off { opacity: 0; transform: translateY(-54%); pointer-events: none; }
  #story header { display: flex; align-items: center; gap: 10px; }
  #story header img { height: 20px; }
  #story header b { font-size: 14.5px; font-weight: 600; }
  #story header small { color: var(--mute); font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 7px; border: 1px solid; white-space: nowrap; transition: all .3s; }
  .badge.work { color: #fdba74; border-color: #c2410c; background: #2a160b; box-shadow: 0 0 18px #f9731633; }
  .badge.think { color: #c4b5fd; border-color: #6d28d9; background: #1b1430; box-shadow: 0 0 18px #7c3aed33; }
  .badge.ok { color: #bbf7d0; border-color: var(--green); background: #12301a; box-shadow: 0 0 18px #5fd06833; }
  .badge.bad { color: #fecaca; border-color: #b91c1c; background: #2a1010; }
  #story .ask { margin: 10px 0 6px; font-size: 13.5px; }
  #story .rows div { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: #d1d5d8; padding: 3px 0; animation: in .35s ease; }
  #story .rows i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--green); transform: translateY(-1px); }
  #story .rows i.o { background: #f59e0b; } #story .rows i.p { background: #a78bfa; }
  #story .label { margin: 10px 0 4px; color: var(--mute); font: 11.5px ui-monospace, monospace; }
  #story pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: #0a0b0b; border: 1px solid #23272a; font: 11.5px/1.5 ui-monospace, monospace; color: #d1d5d8; white-space: pre-wrap; word-break: break-word; max-height: 130px; overflow: hidden; }
  #story pre .cmd { color: var(--green); }
  #story .answer { margin-top: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; max-height: 63px; overflow: hidden; }
  #feed { transition: opacity .5s; }
  body.story #feed { opacity: 0; }
  #story .meta { margin-top: 8px; color: var(--mute); font-size: 12px; }
  .caret::after { content: "▍"; color: var(--green); animation: beat 1s steps(2) infinite; }
  #feed { gap: 6px; }

  #density { margin-top: 12px; font-size: 15px; color: var(--fg); }
  #hint { margin-top: 6px; max-width: 470px; font-size: 12.5px; line-height: 1.45; color: var(--mute); min-height: 2.9em; transition: opacity .6s; }
  #hint b { color: #cfe9d2; font-weight: 600; }
  #density b { color: var(--green); font-weight: 600; }
  #density span { color: var(--mute); }
  .life { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 10px 0 4px; }
  .life div { border: 1px solid #2a2d30; border-radius: 7px; padding: 3px 7px; font-size: 11.5px; color: #6f7479; background: #0c0d0e; line-height: 1.3; }
  .life div small { display: block; font: 10.5px ui-monospace, monospace; color: inherit; opacity: .9; }
  .life div.done { color: #cfe9d2; border-color: var(--greenDim); }
  .life div.now { color: #fff; border-color: var(--green); background: #12301a; box-shadow: 0 0 14px #5fd06833; }
  .life div.blue.done { color: #cfe0fb; border-color: #2c4a73; }
  .life div.blue.now { border-color: #60a5fa; background: #16243a; box-shadow: 0 0 14px #60a5fa44; }
  .life i { color: #4a4f54; font-style: normal; font-size: 11px; }
  .node { font: 11.5px ui-monospace, monospace; color: var(--mute); margin-bottom: 4px; }
  .node b { color: #60a5fa; font-weight: 500; }

  /* The compute heartbeat along the bottom: baseline = agents awake, a spike per agent. */
  #pulseBox { left: 430px; right: 440px; bottom: 28px; height: 96px; border: 1px solid #1f2326; border-radius: 12px; background: #0b0d0cd9; overflow: hidden; transition: right .5s; }
  body.story #pulseBox { right: 440px; }
  #pulse { width: 100%; height: 100%; display: block; }
  #pulseLbl { position: absolute; left: 12px; top: 8px; font: 600 10.5px Inter, sans-serif; letter-spacing: .12em; color: #6f7479; }
  #pulseLbl b { color: var(--green); letter-spacing: 0; font-weight: 600; margin-left: 6px; }

  body.idle #qr { animation: invite 2.4s ease-in-out infinite; }
  @keyframes invite { 50% { box-shadow: 0 0 70px #5fd06855; border-color: var(--green); transform: translateY(-3px); } }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice" aria-label="Live map of kagent on Agent Substrate"></svg>
<div id="sweep"></div>
<div id="vig"></div>
<div id="title" class="ui"><img src="/agent-flow/static/kagent-logo.svg" alt="kagent"><h1>on Agent Substrate</h1><p>Every cube is someone's real request, live.</p>
  <div id="live"><i></i><b>LIVE</b><span id="since">waiting for the first request</span></div>
  <div id="density"></div><div id="hint"></div></div>
<div id="stats" class="ui"></div>
<div id="toasts" class="ui" aria-live="polite"></div>
<div id="qr" class="ui"><div class="code" id="qrcode"></div><div><b>Scan to run your own agent</b><span id="joinUrl"></span><span class="ask" id="askIdea"></span></div></div>
<div id="story" class="ui off" aria-live="polite"></div>
<div id="pulseBox" class="ui"><canvas id="pulse" aria-label="Compute heartbeat"></canvas><div id="pulseLbl">COMPUTE<b id="pulseNow"></b></div></div>
<div id="feed" class="ui" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>window.KAGENT_ICON = "/agent-flow/static/kagent-icon.svg"; window.AGW_ICON = "/agent-flow/static/agentgateway-icon.svg"; window.OPENAI_ICON = "/agent-flow/static/openai-icon.svg";</script>
<script src="/agent-flow/static/scene.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// The QR code points phones at /agent-flow. ?join=<url> overrides it; a screen opened on
// localhost points at the public domain instead.
const params = new URLSearchParams(location.search);
const local = /^(localhost|127\.|\[::1\])/.test(location.hostname);
const joinUrl = params.get("join") || (local ? "https://kubecon.agentpwned.ai/agent-flow" : location.origin + "/agent-flow");
$("joinUrl").textContent = joinUrl.replace(/^https?:\/\//, "");
try {
  const qr = qrcode(0, "M");
  qr.addData(joinUrl);
  qr.make();
  $("qrcode").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
} catch (e) {
  $("qrcode").style.display = "none";
}

// Player colors from the arcade (platform.Players), for feed avatars.
const COLORS = { green: "#5fd068", blue: "#60a5fa", red: "#f87171", purple: "#a78bfa", gold: "#fbbf24", pink: "#f472b6" };
function feed(cls, nick, text, code, color) {
  const f = $("feed"), d = document.createElement("div");
  d.className = "ev " + cls;
  d.innerHTML = `<div class="av" style="background:${COLORS[color] || "#8a8f94"}">${esc((nick || "?")[0].toUpperCase())}</div><b>${esc(nick)}</b><span>${esc(text)}</span><code>${esc(code || "")}</code>`;
  f.appendChild(d);
  while (f.children.length > 3) f.firstChild.remove();
}
function toast(html, cls = "") {
  const t = document.createElement("div");
  t.className = "toast " + cls;
  t.innerHTML = html;
  $("toasts").appendChild(t);
  while ($("toasts").children.length > 2) $("toasts").firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 500); }, 3200);
}
const LABELS = { jailbreak: "steal the OpenAI key", resume: "pick up where it left off", code: "write code", webhook: "call a webhook", explore: "explore the sandbox", dice: "roll the dice", haiku: "write a haiku" };
const QUIET = new Set(["controller", "sandbox"]);

// Drifting sparks behind the map.
for (let i = 0; i < 14; i++) {
  const s = document.createElement("div");
  s.className = "spark";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = 20 + Math.random() * 80 + "vh";
  s.style.animationDuration = 7 + Math.random() * 9 + "s";
  s.style.animationDelay = -Math.random() * 12 + "s";
  document.body.appendChild(s);
}

// Stats count up to their new value and glow when they change.
const shown = {};
function stat(key, value, label, fmt = (v) => v.toLocaleString()) {
  let el = document.querySelector(`.stat[data-k="${key}"]`);
  if (!el) {
    el = document.createElement("div");
    el.className = "stat"; el.dataset.k = key;
    el.innerHTML = `<b></b>${esc(label)}`;
    $("stats").appendChild(el);
  }
  const b = el.querySelector("b");
  if (typeof value !== "number") { b.textContent = value; return; }
  const from = shown[key] ?? value;
  shown[key] = value;
  if (from === value) { b.textContent = fmt(value); return; }
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 900);
  const t0 = performance.now();
  (function tick(now) {
    const f = Math.min(1, (now - t0) / 700), v = Math.round(from + (value - from) * (1 - Math.pow(1 - f, 3)));
    b.textContent = fmt(v);
    if (f < 1) requestAnimationFrame(tick);
  })(t0);
}

let lastRequest = 0, lastActive = Date.now();
// What each component is, for the card shown when someone clicks a station.
const STATIONS = {
  gw: ["agentgateway", "/agent-flow/static/agentgateway-icon.svg", "Every phone request, LLM call and webhook goes through it. It holds the OpenAI key (agents only have a placeholder) and enforces these policies: a prompt guard that rejects jailbreaks and requests for secrets, a token budget for flow agents, a per-visitor request limit, and LLM calls only from inside the cluster.",
    (s) => [["blocked by prompt guard", s.blocked || 0], ["rate limited", s.limited || 0], ["webhooks", (s.hooks || []).length]]],
  ctrl: ["kagent-controller", "/agent-flow/static/kagent-icon.svg", "Turns each visitor into a kagent session and talks to their agent over A2A. It reads the agent's CRD to know which model and tools it gets.",
    (s) => [["agents", s.agents], ["requests", s.total]]],
  pg: ["postgres", null, "Keeps every session, task and message, so an agent still remembers you after it wakes from a snapshot.", (s) => [["agents", s.agents]]],
  ate: ["Substrate scheduler", null, "ate-api-server and ate-controller place each agent as an actor on a worker pool, and wake or suspend it on demand.",
    (s) => [["new actor p50", ms(s.timings?.create)], ["workers", s.substrate?.workers ?? "–"]]],
  idp: ["ate-idp", null, "Gives every actor its own identity, so each agent can prove who it is to the rest of the platform.", (s) => [["actors", s.substrate?.actors ?? "–"]]],
  box: ["gVisor sandbox", null, "atelet runs each agent in its own gVisor sandbox: a user-space kernel between the agent and the node. Its tools run in here.",
    (s) => [["awake now", s.substrate?.running ?? 0], ["run p50", ms(s.timings?.run)]]],
  egress: ["atenet-egress", null, "Agents can only reach allowed hosts. Here that is agentgateway, for LLM calls and the booth webhook. Everything else is blocked.",
    (s) => [["webhooks", (s.hooks || []).length]]],
  llm: ["OpenAI (the LLM)", "/agent-flow/static/openai-icon.svg", "Agents never hold the OpenAI key. Every LLM call leaves the sandbox through atenet-egress to agentgateway, which adds the key and forwards it.",
    (s) => [["tokens so far", (s.tokens || 0).toLocaleString()], ["requests", s.total]]],
  rf: ["Snapshot Storage", null, "Idle agents are snapshotted here (rustfs) and use no CPU at all. The next request restores them where they left off.",
    (s) => [["asleep", s.substrate?.suspended ?? 0], ["snapshot p50", ms(s.timings?.snapshot)], ["restore p50", ms(s.timings?.restore)]]],
};
function ms(p) { return p && p.count ? (p.p50 >= 1000 ? (p.p50 / 1000).toFixed(1) + "s" : p.p50 + "ms") : "–"; }
let lastState = null;
function stationCard(key) {
  const st = STATIONS[key], el = $("story");
  if (!st || !lastState) return;
  document.body.classList.add("story");
  storyId = "station:" + key;
  const [name, icon, text, nums] = st;
  el.innerHTML = `<header>${icon ? `<img src="${icon}" alt="">` : ""}<b>${esc(name)}</b><small>Agent Substrate component</small><span class="badge ok">Live</span></header>
    <div class="ask" style="font-size:14px;color:#d1d5d8">${esc(text)}</div>
    <div class="rows">${nums(lastState).map(([k, v]) => `<div><i></i><span>${esc(k)}: <b>${esc(v)}</b></span></div>`).join("")}</div>
    <div class="meta">Click another component, or a cube to follow it.</div>`;
  el.classList.remove("off");
}

const flow = startFlowScreen($("scene"), {
  camera: true,
  onMove(m) {
    if (m.error) return;
    if (m.kind === "wake") heart.beat(0.9, m.nick + " · woke");
    if (m.kind === "wake") {
      toast(`<span>⚡</span><span><b>${esc(m.nick)}</b>'s agent woke up in <b>${fmtMs(m.ms)}</b> after ${fmtMs(m.sleptMs)} asleep</span>`);
      if (m.nodeAfter && m.nodeBefore && m.nodeAfter !== m.nodeBefore) toast(`<span>🛰️</span><span>…on a different node: ${esc(m.nodeBefore)} → <b>${esc(m.nodeAfter)}</b></span>`, "hook");
    } else toast(`<span>💤</span><span><b>${esc(m.nick)}</b>'s agent ${m.kind === "auto" ? "was idle, so Substrate put it" : "went"} to sleep · snapshot in <b>${fmtMs(m.ms)}</b></span>`);
  },
  onPick(key) { stationCard(key); },
  onStep(run, step) {
    lastRequest = Date.now();
    if (step.stage === "schedule") heart.beat(1, run.nick + " · new");
    else if (step.stage === "restore" && step.text !== "restored" && !step.text.includes("node")) heart.beat(0.9, run.nick + " · woke");
    else if (step.stage === "gateway") heart.beat(0.25);
    else if ((step.stage === "tool" || step.stage === "hook") && step.text !== "tool output") heart.beat(0.4);
    if (step.stage === "gateway") return feed("", run.nick, LABELS[run.task] ? `asks their agent to ${LABELS[run.task]}` : `asks “${run.ask}”`, "", run.color);
    if (step.text.includes("blocked by agentgateway")) toast(`<span>🛡️</span><span>agentgateway's prompt guard <b>blocked</b> ${esc(run.nick)}'s request before it reached the LLM</span>`, "bad");
    if (step.text.includes("rate limited by agentgateway")) toast(`<span>🛡️</span><span>agentgateway <b>rate limited</b> ${esc(run.nick)}'s agent</span>`, "bad");
    if (step.text === "woke up on a different node") toast(`<span>🛰️</span><span><b>${esc(run.nick)}</b>'s agent woke on a different node: ${esc(step.detail)}</span>`, "hook");
    if (step.stage === "schedule") toast(`<span>✨</span><span>Welcome <b>${esc(run.nick)}</b>, your agent just got its own gVisor sandbox</span>`);
    if (QUIET.has(step.stage) || step.text === "tool output") return;
    feed(step.stage === "error" ? "bad" : "", run.nick, step.text, step.detail, run.color);
  },
  onHook(h) {
    feed("hook", h.name, "webhook received at the booth", "POST ✓");
    toast(`<span>🔔</span><span><b>${esc(h.name)}</b>'s agent called the booth webhook</span>`, "hook");
  },
  onState(s) {
    const t = s.timings || {}, sub = s.substrate || {};
    const ms = (p) => (p && p.count ? (p.p50 >= 1000 ? (p.p50 / 1000).toFixed(1) + "s" : p.p50 + "ms") : "–");
    stat("agents", s.agents, "agents"); stat("runs", s.total, "runs"); stat("tokens", s.tokens || 0, "tokens");
    stat("firstNew", ms(t.run_new), "answer · new agent"); stat("firstRestored", ms(t.run_restored), "answer · restored");
    const workers = (sub.pools || []).reduce((n, p) => n + (p.workers || 0), 0);
    $("density").innerHTML = `<b>${(sub.actors ?? 0).toLocaleString()}</b> agents on <b>${workers}</b> sandboxes <span>·</span> <b>${(sub.suspended ?? 0).toLocaleString()}</b> asleep using <b>0 CPU</b>`;
    stat("restore", ms(t.restore), "restore p50"); stat("snapshot", ms(t.snapshot), "snapshot p50");
    lastState = s;
    heart.set(sub.running ?? 0, (sub.pools || []).reduce((n, p) => n + (p.workers || 0), 0));
    if (flow?.picked()) stationCard(flow.picked());
    else story((s.runs || []).find((r) => r.id === flow?.focus()));
  },
});

// The compute heartbeat: a scrolling trace whose baseline is the share of sandboxes busy
// with an awake agent, with an ECG-style spike each time an agent is created or woken up
// (named), and smaller blips for requests arriving and tools running.
const heart = (() => {
  const cv = $("pulse"), cx = cv.getContext("2d");
  const BEAT = [0, .04, .1, .06, 0, -.12, 1, -.38, 0, .06, .14, .18, .12, .05, 0];
  // ys and labels are one entry per pixel column; pending holds names waiting for their spike.
  let W = 0, H = 0, ys = [], labels = [], pending = [], queue = [], level = 0, target = 0, last = performance.now(), carry = 0;
  const fit = () => {
    const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0);
    W = r.width; H = r.height;
    while (ys.length < W) { ys.unshift(0); labels.unshift(null); }
  };
  addEventListener("resize", fit); fit();
  function beat(size, tag) {
    const n = 30, start = queue.length < 6 ? 0 : queue.length; // let beats queue up, never overlap
    for (let i = 0; i < n; i++) {
      const f = (i / (n - 1)) * (BEAT.length - 1), k = Math.floor(f), t = f - k;
      const v = (BEAT[k] * (1 - t) + (BEAT[k + 1] ?? 0) * t) * size;
      queue[start + i] = (queue[start + i] || 0) + v;
    }
    if (tag) pending.push({ at: start + 6, text: tag });
  }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    level += (target - level) * (1 - Math.exp(-dt * 1.5));
    carry += dt * 70; // pixels per second
    while (carry >= 1) {
      carry--;
      const spike = queue.length ? queue.shift() : 0;
      const due = pending.findIndex((t) => t.at <= 0);
      ys.push(level + spike + (Math.random() - 0.5) * 0.015);
      labels.push(due >= 0 ? pending.splice(due, 1)[0].text : null);
      pending.forEach((t) => t.at--);
      if (ys.length > W) { ys.shift(); labels.shift(); }
    }
    cx.clearRect(0, 0, W, H);
    cx.strokeStyle = "#16201a"; cx.lineWidth = 1;
    for (let x = W - ((now / 1000 * 70) % 28); x > 0; x -= 28) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
    const base = H - 16, amp = H - 34, Y = (v) => base - Math.max(-0.4, Math.min(1.15, v)) * amp * 0.62;
    cx.shadowColor = "#5fd068"; cx.shadowBlur = 8; cx.strokeStyle = "#5fd068"; cx.lineWidth = 1.8; cx.lineJoin = "round";
    cx.beginPath();
    const off = W - ys.length;
    ys.forEach((v, i) => (i ? cx.lineTo(off + i, Y(v)) : cx.moveTo(off + i, Y(v))));
    cx.stroke(); cx.shadowBlur = 0;
    const hx = W - 1, hy = Y(ys[ys.length - 1] || 0);
    cx.fillStyle = "#c8ffcb"; cx.beginPath(); cx.arc(hx - 2, hy, 3, 0, 7); cx.fill();
    cx.font = "11px ui-monospace, monospace"; cx.fillStyle = "#cfe9d2";
    labels.forEach((t, i) => { if (t) cx.fillText(t, off + i - 10, 30); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {
    beat,
    set(running, workers) {
      target = workers ? Math.min(1, running / workers) * 0.9 + 0.04 : 0.04;
      $("pulseNow").textContent = `${running} awake · ${workers ? Math.round((100 * running) / workers) : 0}% of sandboxes`;
    },
  };
})();

// typeInto types text into el a few characters at a time, continuing from what's shown.
function typeInto(el, text, html = (t) => esc(t)) {
  if (el._full === text) return;
  el._full = text;
  let n = el._shown && text.startsWith(el._shown) ? el._shown.length : 0;
  clearInterval(el._timer);
  el.classList.add("caret");
  el._timer = setInterval(() => {
    n = Math.min(text.length, n + 3);
    el._shown = text.slice(0, n);
    el.innerHTML = html(el._shown);
    if (n >= text.length) { clearInterval(el._timer); el.classList.remove("caret"); }
  }, 22);
}
const BADGE = {
  gateway: ["Routing", "work"], controller: ["Routing", "work"], schedule: ["New actor", "work"], restore: ["Waking up", "work"],
  sandbox: ["Awake", "work"], llm: ["Thinking", "think"], tool: ["Running tool", "work"], hook: ["Calling webhook", "work"],
  reply: ["Answered", "ok"], snapshot: ["Saving snapshot", "ok"], asleep: ["Asleep", "ok"], error: ["Error", "bad"], blocked: ["Blocked by agentgateway", "bad"],
};
let storyId = null;
function story(r) {
  const el = $("story");
  document.body.classList.toggle("story", !!r); // one card at a time, like Tessl
  if (!r) { el.classList.add("off"); return; }
  if (storyId !== r.id) {
    storyId = r.id;
    el.innerHTML = `<header><img src="/agent-flow/static/kagent-icon.svg" alt=""><b>flowbot</b><small id="sWho"></small><span class="badge" id="sBadge"></span></header>
      <div class="life" id="sLife"></div><div class="node" id="sNode"></div>
      <div class="ask" id="sAsk"></div><div class="rows" id="sRows"></div>
      <div id="sCode" style="display:none"><div class="label">gVisor sandbox · bash</div><pre id="sPre"></pre></div>
      <div class="answer" id="sAnswer"></div><div class="meta" id="sMeta"></div>`;
  }
  el.classList.remove("off");
  $("sWho").textContent = `${r.nick}'s agent`;
  const [label, cls] = BADGE[r.policy === "blocked" ? "blocked" : r.stage] || ["Working", "work"];
  const b = $("sBadge");
  if (b.textContent !== label) { b.textContent = label; b.className = "badge " + cls; b.animate([{ transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 300 }); }
  $("sAsk").textContent = `“${r.ask || r.task}”`;
  // The agent's lifecycle for this run, with Substrate's real timings.
  const life = lifecycle(r), cur = life.map((x) => x[2]).lastIndexOf(true), blue = !r.new;
  const lifeHtml = life.map(([k, v, on], i) => `<div class="${on ? (i === cur && !r.done ? "now" : "done") : ""}${blue ? " blue" : ""}">${esc(k)}${v ? `<small>${esc(v)}</small>` : ""}</div>`).join("<i>→</i>");
  if ($("sLife")._html !== lifeHtml) { $("sLife")._html = lifeHtml; $("sLife").innerHTML = lifeHtml; }
  $("sNode").innerHTML = !r.nodeAfter ? "" : !r.nodeBefore ? `woke on ${esc(r.nodeAfter)}`
    : r.nodeAfter !== r.nodeBefore ? `slept on ${esc(r.nodeBefore)} · woke on <b>${esc(r.nodeAfter)}</b>` : `slept and woke on ${esc(r.nodeAfter)}`;
  // Key moments only: where the agent woke up, each tool it ran, and how it ended.
  const keep = r.steps.filter((x) => ["tool", "hook", "error"].includes(x.stage) && x.text !== "tool output"
    || x.text === "kept its files through the snapshot" || x.text === "woke up on a different node");
  const rows = keep.slice(-4).map((x) => `<div><i class="${x.stage === "tool" || x.stage === "hook" ? "o" : ""}"></i><span>${esc(x.text)}${x.detail && x.stage !== "tool" && x.stage !== "hook" ? ` · ${esc(x.detail)}` : ""}</span></div>`).join("");
  if ($("sRows")._html !== rows) { $("sRows")._html = rows; $("sRows").innerHTML = rows; }
  // The latest command and its output, typed out.
  const calls = r.steps.filter((x) => (x.stage === "tool" || x.stage === "hook") && x.text !== "tool output");
  const outs = r.steps.filter((x) => x.text === "tool output");
  if (calls.length) {
    $("sCode").style.display = "";
    const cmd = (calls.at(-1).detail || "").split("\n").slice(0, 3).join("\n");
    const out = outs.length >= calls.length ? (outs.at(-1).detail || "").split("\n").slice(0, 7).join("\n") : "";
    const text = "$ " + cmd + (out ? "\n" + out : "");
    const cut = 2 + cmd.length; // "$ " + the command, in green; the output after it
    typeInto($("sPre"), text, (t) => `<span class="cmd">${esc(t.slice(0, cut))}</span>${esc(t.slice(cut))}`);
  } else $("sCode").style.display = "none";
  if (r.answer) typeInto($("sAnswer"), r.answer); else { $("sAnswer").textContent = ""; $("sAnswer")._full = ""; $("sAnswer")._shown = ""; }
  $("sMeta").textContent = r.answer ? `${(r.ms / 1000).toFixed(1)}s · ${r.tokens.toLocaleString()} tokens` : "";
}

// Quiet hints under the headline, one at a time: how big the cluster is, how lazy agents
// are, and roughly what Substrate saves. All from live data except the stated pod price.
const HINTS = [
  (s, c, w) => w && c.nodes ? `<b>${w}</b> gVisor sandboxes (${flowWorkers(s)} for Agent Flow) on <b>${c.nodes}</b> Kubernetes nodes, all on one <b>${c.hostCpus}-CPU, ${c.hostMemGiB} GiB</b> machine.` : "",
  (s) => { const sub = s.substrate || {}; if (!sub.actors) return "";
    const pct = Math.round((100 * (sub.suspended || 0)) / sub.actors), run = s.timings?.run;
    return `Agents are lazy: <b>${pct}%</b> are asleep right now.${run?.count ? ` A visit keeps one busy for about <b>${fmtMs(run.p50)}</b>, then it sleeps for free.` : ""}`; },
  (s, c, w) => { const a = s.substrate?.actors || 0; if (!a || !w) return "";
    const perDay = Math.max(0, a - w) * 24 * c.podHourUsd;
    return `One always-on pod per agent would mean <b>${a}</b> pods. Substrate runs <b>${w}</b> sandboxes: about <b>$${perDay.toFixed(2)}/day</b> saved (est. at $${c.podHourUsd}/pod-hour).`; },
  (s, c, w) => { const a = s.substrate?.actors || 0; return a && w ? `That's <b>${(a / w).toFixed(1)}</b> agents per sandbox. Idle ones wait in Snapshot Storage, not in memory.` : ""; },
  (s) => { const t = s.timings || {}; return t.restore?.count ? `Waking an agent takes about <b>${fmtMs(t.restore.p50)}</b>; putting one to sleep about <b>${fmtMs(t.snapshot?.p50)}</b>.` : ""; },
];
function flowWorkers(s) { return (s.substrate?.pools || []).find((p) => p.name === "flow")?.workers ?? 0; }
let hintI = 0;
setInterval(() => {
  if (!lastState) return;
  const s = lastState, c = s.cluster || {}, w = (s.substrate?.pools || []).reduce((n, p) => n + (p.workers || 0), 0);
  let html = "";
  for (let tries = 0; tries < HINTS.length && !html; tries++) html = HINTS[hintI++ % HINTS.length](s, c, w);
  const el = $("hint");
  el.style.opacity = 0;
  setTimeout(() => { el.innerHTML = html; el.style.opacity = 1; }, 600);
}, 7000);

// "Last request" ticker, idle tour and the QR card's rotating ideas.
const IDEAS = ["“write FizzBuzz and run it”", "“call the booth webhook”", "“what kernel are you on?”", "“roll three dice”", "“a haiku about pods”"];
let tourI = 0, ideaI = 0;
setInterval(() => {
  if (flow.active()) lastActive = Date.now();
  const ago = Math.round((Date.now() - lastRequest) / 1000);
  $("since").textContent = !lastRequest ? "waiting for the first request" : ago < 3 ? "request in flight" : `last request ${ago < 60 ? ago + "s" : Math.round(ago / 60) + "m"} ago`;
  document.body.classList.toggle("idle", Date.now() - lastActive > 12000);
}, 1000);
setInterval(() => { if (document.body.classList.contains("idle")) flow.tour(tourI++); }, 3800);
setInterval(() => {
  const el = $("askIdea");
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = "Try: " + IDEAS[ideaI++ % IDEAS.length]; el.style.opacity = 1; }, 400);
}, 3500);
</script>
</body>
