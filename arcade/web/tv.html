<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0e0f">
<title>Agent Arcade · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* A 1920x1080 stage scaled to fit the screen, so a TV never scrolls and reads the same
     at any resolution. Sizes are for 1080p, readable from about 3 m. */
  :root { --bg: #0d0e0f; --grid: #17191b; --fg: #e8e8e8; --mute: #8a8f94; --green: #5fd068; --greenDim: #3d7a45; --line: #24272a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 20px/1.35 Inter, system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; display: grid; grid-template-columns: 1056px 1fr; gap: 28px; padding: 30px 34px;
    background: linear-gradient(transparent 0 calc(100% - 1px), #ffffff05 0) 0 0 / 100% 40px, linear-gradient(90deg, transparent 0 calc(100% - 1px), #ffffff05 0) 0 0 / 40px 100%, var(--bg); }

  /* Left: live traffic. */
  .left { display: grid; grid-template-rows: auto 1fr; gap: 18px; min-height: 0; }
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .hdr img { height: 40px; display: block; margin-bottom: 8px; }
  .hdr h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  .hdr p { margin: 4px 0 0; color: var(--mute); font-size: 19px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; max-width: 470px; }
  .pill { border: 1px solid #2a2d30; background: #121314ee; border-radius: 999px; padding: 7px 16px; font-size: 17px; color: var(--mute); white-space: nowrap; }
  .pill b { color: var(--fg); font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .pill.green b { color: var(--green); }
  .live { display: inline-flex; align-items: center; gap: 10px; color: var(--green); font-weight: 700; letter-spacing: .12em; font-size: 15px; margin-top: 10px; }
  .live i { width: 11px; height: 11px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(.6); opacity: .5; } }
  .factory { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #131614, #0d0e0f 75%); min-height: 0; }
  .factory svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .factory .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 60%, var(--bg) 100%); }
  .factory .cap { position: absolute; left: 16px; top: 14px; font-size: 17px; color: var(--mute); background: #0d0e0fd9; border: 1px solid #2a2d30; border-radius: 999px; padding: 6px 14px; }
  .factory .cap b { color: var(--fg); }
  #feed { position: absolute; left: 16px; bottom: 14px; width: 560px; display: flex; flex-direction: column; gap: 6px; }
  #feed div { display: flex; gap: 10px; align-items: center; font-size: 17px; background: #0f1311ee; border: 1px solid #2a2d30; border-radius: 10px; padding: 6px 12px; animation: in .4s ease-out; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #feed b { font-weight: 600; }
  #feed span { color: var(--mute); overflow: hidden; text-overflow: ellipsis; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  /* Right: the games, three tiles a page, turning every 10 s. */
  .right { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
  .rhead { display: flex; justify-content: space-between; align-items: center; }
  .rhead h2 { margin: 0; font-size: 28px; font-weight: 800; }
  .rhead .pg { display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 16px; }
  .rhead .bar { width: 120px; height: 6px; border-radius: 3px; background: #22262a; overflow: hidden; }
  .rhead .bar i { display: block; height: 100%; width: 0; background: var(--green); }
  .tiles { display: grid; grid-template-rows: repeat(3, 1fr); gap: 16px; min-height: 0; }
  .tile { --c: var(--green); display: grid; grid-template-columns: 300px 1fr 220px; gap: 18px; align-items: center; padding: 14px; border-radius: 18px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, #2a2d30); background: #101311f2; box-shadow: 0 0 40px color-mix(in srgb, var(--c) 10%, transparent); min-height: 0; animation: in .5s ease-out; }
  .tile .shot { width: 300px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; border: 1px solid #2a2d30; display: block; }
  .tile h3 { margin: 0; font-size: 27px; font-weight: 800; color: var(--c); line-height: 1.1; }
  .tile p { margin: 6px 0 10px; font-size: 17px; color: #c9ccce; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .top { font-size: 17px; --ab-accent: var(--c); }
  .tile .top .ab-row { padding: 3px 10px; }
  .tile .qr { text-align: center; font-size: 15px; color: var(--mute); }
  .tile .qr .code { background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 6px; aspect-ratio: 1; display: grid; place-items: center; color: #111; font-size: 14px; word-break: break-all; }
  .tile .qr svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <section class="left">
    <div class="hdr">
      <div>
        <img src="/agent-flow/static/kagent-logo.svg" alt="kagent">
        <h1>Agent Arcade on Agent Substrate</h1>
        <p>Every character is a real AI agent in its own gVisor sandbox.</p>
        <div class="live"><i></i>LIVE TRAFFIC FROM EVERY GAME</div>
      </div>
      <div class="pills">
        <div class="pill"><b id="nActors">–</b>agents</div>
        <div class="pill green"><b id="nAwake">–</b>awake</div>
        <div class="pill"><b id="nWorkers">–</b>sandboxes</div>
        <div class="pill"><b id="nAsleep">–</b>asleep · 0 CPU</div>
        <div class="pill"><b id="nRestore">–</b>wake-up p50</div>
        <div class="pill"><b id="nTurns">0</b>turns/min</div>
      </div>
    </div>
    <div class="factory">
      <svg id="scene" viewBox="40 70 1320 650" preserveAspectRatio="xMidYMid meet" aria-label="Live map of every agent on Agent Substrate"></svg>
      <div class="vig"></div>
      <div class="cap">Every cube is a real agent turn · <b id="density">–</b></div>
      <div id="feed" aria-live="polite"></div>
    </div>
  </section>

  <section class="right">
    <div class="rhead"><h2>Scan a code to play</h2><div class="pg"><span id="pageNo"></span><div class="bar"><i id="bar"></i></div></div></div>
    <div class="tiles" id="tiles"></div>
  </section>
</div>

<script src="/static/qrcode-1.4.4.min.js"></script>
<script src="/static/arcade.js?v=2"></script>
<script>window.KAGENT_ICON = "/agent-flow/static/kagent-icon.svg"; window.AGW_ICON = "/agent-flow/static/agentgateway-icon.svg"; window.OPENAI_ICON = "/agent-flow/static/openai-icon.svg";</script>
<script src="/agent-flow/static/scene.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const SITE = "https://kubecon.agentpwned.ai";
const MISSIONS = "https://gd-frontend-413299367082.us-central1.run.app/";

// Fit the 1920x1080 stage to the window.
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = $("stage");
  st.style.transform = `scale(${k})`;
  st.style.left = (innerWidth - 1920 * k) / 2 + "px";
  st.style.top = (innerHeight - 1080 * k) / 2 + "px";
}
addEventListener("resize", fit);
fit();

// qr draws url's QR code into el (an SVG that fills it); if that fails, the address shows.
function qr(el, url, cell) {
  try {
    const q = qrcode(0, "M"); q.addData(url); q.make();
    el.innerHTML = q.createSvgTag({ cellSize: cell, margin: 0, scalable: true });
  } catch { el.textContent = url.replace(/^https?:\/\//, ""); }
}

// ---- the games ----
const TILES = [
  { path: "/substrate-siege", name: "Substrate Siege", color: "#38bdf8", unit: "Top runs", pitch: "3 minutes in a night city full of real agents. Freeze them, snapshot them, top the board." },
  { path: "/cluster-defense", name: "Cluster Defense", color: "#fb923c", unit: "Top pilots", pitch: "Subagents fill the cluster's workers. Fly a ship and suspend them before it's full." },
  { path: "/gateway-defense", name: "Gateway Defense", color: "#22d3ee", unit: "Top defenders", pitch: "Tower defense with real controls: prompt guard, rate limit, egress and suspend." },
  { path: "/agent-flow", name: "Agent Flow", color: "#5fd068", unit: "Top agents", pitch: "Give your own agent a task and watch it travel through the platform on the left." },
  { path: "/duck-hunt", name: "Duck Hunt", color: "#facc15", unit: "Top hunters", pitch: "Hatch AI ducks. The hunter snapshots them; bring them back to life." },
  { path: MISSIONS, name: "AI agentgateway missions", color: "#a78bfa", unit: "Top players", ext: true, img: "agentgateway-missions",
    pitch: "Configure a real agentgateway, take contracts, stack points and dodge the cops." },
];
const PER = 3, TURN = 10000;
let page = 0, turnAt = performance.now();
function tile(g) {
  const url = g.ext ? g.path : SITE + g.path, img = g.img || g.path.slice(1);
  return `<div class="tile" style="--c:${g.color}">
    <img class="shot" src="/static/shots/${img}.webp?v=1" alt="${esc(g.name)} screenshot">
    <div><h3>${esc(g.name)}</h3><p>${esc(g.pitch)}</p>
      <div class="top" data-board="${esc(g.path)}" data-empty="${g.ext ? "Leaderboard in game." : "No scores yet. Be the first."}"></div></div>
    <div class="qr"><div class="code" data-url="${esc(url)}"></div>scan to play</div></div>`;
}
function showPage() {
  const n = Math.ceil(TILES.length / PER);
  page %= n;
  $("tiles").innerHTML = TILES.slice(page * PER, page * PER + PER).map(tile).join("");
  $("tiles").querySelectorAll("[data-url]").forEach((el) => qr(el, el.dataset.url, 5));
  $("tiles").querySelectorAll("[data-board]").forEach((el) => Arcade.board(el, el.dataset.board, { n: 3, detail: false, empty: el.dataset.empty }));
  $("pageNo").textContent = `${page + 1} / ${n}`;
  turnAt = performance.now();
}
showPage();
(function tick(now) {
  const f = (now - turnAt) / TURN;
  if (f >= 1) { page++; showPage(); }
  $("bar").style.width = Math.min(100, f * 100) + "%";
  requestAnimationFrame(tick);
})(performance.now());

// ---- live numbers ----
const fmt = (n) => (n == null ? "–" : Number(n).toLocaleString());
const ms = (n) => (!n ? "–" : n >= 1000 ? (n / 1000).toFixed(1) + "s" : n + "ms");
async function poll() {
  try {
    const s = await (await fetch("/api/stats")).json();
    $("nActors").textContent = fmt(s.actors); $("nAwake").textContent = fmt(s.running); $("nWorkers").textContent = fmt(s.workers);
    $("nAsleep").textContent = fmt(s.suspended); $("nRestore").textContent = ms(s.restoreP50Ms);
    $("density").textContent = s.actors && s.workers ? `${(s.actors / s.workers).toFixed(1)} agents per sandbox` : "–";
  } catch {}
}
poll();
setInterval(poll, 4000);

// ---- the live factory and its activity feed ----
function feed(color, who, text) {
  const d = document.createElement("div");
  d.innerHTML = `<i style="background:${color}"></i><b>${esc(who)}</b><span>${esc(text)}</span>`;
  $("feed").appendChild(d);
  while ($("feed").children.length > 4) $("feed").firstChild.remove();
}
const flow = startFlowScreen($("scene"), {
  camera: false,
  onOp(o, game, color) {
    if (o.kind === "turn" && o.phase === "end") feed(color, game, o.err ? "agent turn failed" : `agent turn · ${(o.ms / 1000).toFixed(1)}s${o.tokens ? ` · ${(o.tokens / 1000).toFixed(1)}k tokens` : ""}`);
    else if (o.kind === "suspend" && !o.err) feed(color, game, `suspended · snapshot in ${o.ms} ms`);
  },
  onStep(run, step) {
    if (step.stage === "gateway") feed("#5fd068", run.nick, "asks their agent: " + run.ask);
    if (step.stage === "reply") feed("#5fd068", run.nick, "got an answer in " + step.detail);
  },
});
setInterval(() => { $("nTurns").textContent = flow.turnsPerMin(); }, 1000);
</script>
</body>
</html>
