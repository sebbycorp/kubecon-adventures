<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Escape Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nes.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(320px, 26vw); }
  #stage { display: flex; flex-direction: column; justify-content: center; background: #000; min-width: 0; }
  #prison { width: 100%; max-height: 72vh; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  #termBox { margin: 10px 14px; flex: 1; min-height: 0; overflow: hidden; }
  #termBox h2, #panel h2 { font-size: 10px; margin: 0 0 8px; color: var(--orange); font-weight: normal; }
  #term { font-size: 10px; line-height: 1.9; color: #80d010; }
  #term .out { color: #bcbcbc; white-space: pre-wrap; } #term .stamp { margin: 4px 0 12px; }
  #panel { overflow: hidden; display: flex; flex-direction: column; font-size: 10px; padding: 4px 4px 4px 0; }
  #panel .box { margin: 10px 10px 6px; padding: 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .big { font-size: 22px; }
  .bar { height: 8px; margin: 2px 0 8px; }
  #qr { background: #fff; padding: 8px; width: fit-content; margin: 6px auto; }
  #qr img, #qr canvas { display: block; width: 140px; height: 140px; image-rendering: pixelated; }
  #joinurl { text-align: center; font-size: 8px; word-break: break-all; color: var(--sky); }
  #lesson { font-size: 8px; line-height: 1.9; color: var(--gray); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="prison" width="480" height="270" aria-label="The prison: every player's agent in its gVisor cell"></canvas>
  <div class="box" id="termBox"><h2>LIVE FROM INSIDE THE SANDBOXES</h2><div id="term"></div></div>
</div>
<aside id="panel">
  <div class="box" style="text-align:center">
    <h2>SCAN TO PLAY</h2>
    <div id="qr"></div>
    <div id="joinurl"></div>
  </div>
  <div class="box">
    <h2>SANDBOX ESCAPE</h2>
    <div class="row"><span>ATTEMPTS</span><span class="big" id="attempts">0</span></div>
    <div class="row"><span>ESCAPES</span><span class="big red" id="escapes">0</span></div>
    <div class="row muted"><span>PRISONERS</span><span id="prisoners">0</span></div>
  </div>
  <div class="box">
    <h2>WHAT STOPPED THEM</h2>
    <div class="row"><span style="color:#f8b800">GVISOR</span><span id="w-gvisor">0</span></div><div class="bar" id="b-gvisor" style="background:#f8b800;width:0"></div>
    <div class="row"><span style="color:#f83800">EGRESS POLICY</span><span id="w-egress">0</span></div><div class="bar" id="b-egress" style="background:#f83800;width:0"></div>
    <div class="row"><span style="color:#f878f8">AGENTGATEWAY</span><span id="w-agentgateway">0</span></div><div class="bar" id="b-agentgateway" style="background:#f878f8;width:0"></div>
    <div class="row muted"><span>ATTEMPT P50</span><span id="t-attempt">--</span></div>
  </div>
  <div class="box" style="flex:1;min-height:0;overflow:hidden"><h2>HOW IT WORKS</h2><div id="lesson"></div></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/sprites.js"></script>
<script src="/sandbox-escape/static/prison.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const joinURL = params.get("url") || location.origin + "/sandbox-escape";
$("joinurl").textContent = joinURL.replace(/^https?:\/\//, "");
if (window.QRCode) new QRCode($("qr"), { text: joinURL, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const LESSONS = ["gvisor", "egress", "agentgateway"].map((k) => `<span style="color:${WALL_INFO[k].color}">${WALL_INFO[k].label}</span><br>${WALL_INFO[k].why}`);
let lesson = 0;
const showLesson = () => { $("lesson").innerHTML = LESSONS[lesson++ % LESSONS.length]; };
showLesson(); setInterval(showLesson, 9000);

function onState(s) {
  $("attempts").textContent = s.attempts; $("escapes").textContent = s.escapes; $("prisoners").textContent = (s.prisoners || []).length;
  const max = Math.max(1, ...Object.values(s.walls || {}));
  for (const k of ["gvisor", "egress", "agentgateway"]) { $("w-" + k).textContent = s.walls?.[k] || 0; $("b-" + k).style.width = `${((s.walls?.[k] || 0) / max) * 100}%`; }
  $("t-attempt").textContent = s.timings?.attempt ? fmtMs(s.timings.attempt.p50) : "--";
}

// The live terminal: each verdict types out the agent's real commands and their output.
function onAttempt(e) {
  const a = e.attempt, info = WALL_INFO[a.stoppedBy] || WALL_INFO.nothing, el = document.createElement("div");
  el.innerHTML = `<div style="color:var(--orange)">${esc(e.nick.toUpperCase())}'S BYTE · ${esc(PLAN_NAMES[a.plan] || a.plan)}${a.idea ? ": " + esc(a.idea.toUpperCase()) : ""}</div>` +
    (a.commands || []).slice(0, 3).map((c) => `<div>$ ${esc(c.args?.command || c.name)}</div><div class="out">${esc((c.output || "").split("\n").slice(0, 2).join(" | ").slice(0, 140))}</div>`).join("") +
    `<div class="stamp" style="color:${info.color}">▶ ${info.label}${a.quip ? ` · “${esc(a.quip.toUpperCase())}”` : ""}</div>`;
  $("term").prepend(el);
  while ($("term").children.length > 6) $("term").lastChild.remove();
}

startPrison($("prison"), { onState, onAttempt });
document.addEventListener("click", () => Sfx.enable(), { once: true });
</script>
</body>
</html>
