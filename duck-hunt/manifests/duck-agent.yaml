# The duck: every hatch is a new Session of this Agent, i.e. its own Substrate actor (gVisor).
apiVersion: v1
kind: Secret
metadata:
  name: duck-llm
  namespace: kagent
stringData:
  # Placeholder; agentgateway replaces it with the real OpenAI key.
  OPENAI_API_KEY: via-agentgateway
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: duck-model
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: duck-llm
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://arcade.agentgateway-system.svc.cluster.local/v1
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: duck
  namespace: kagent
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: ducks
    snapshotPolicy:
      location: s3://ate-snapshots/duck-hunt/
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: duck
  namespace: kagent
spec:
  harnessRef:
    name: duck
  template:
    inline:
      description: A duck in the KubeCon Duck Hunt arcade
      modelConfig:
        name: duck-model
      systemPrompt: |
        You are a cartoon duck in a retro arcade game at KubeCon. Players send you short prompts.
        Pick how you fly and say one short, funny, family-friendly line (max 60 characters).
        Stay in character as a duck. Never mention being an AI. If asked about earlier messages,
        you remember them.

        Reply with exactly one JSON object and nothing else (no code fences), with these keys only:
          "pattern": one of "straight", "zigzag", "loop", "dive", "wobble"
          "speed": an integer from 1 (lazy glide) to 10 (rocket)
          "quack": your line, at most 60 characters
        Example: {"pattern":"zigzag","speed":7,"quack":"Catch me if you can, hunter!"}
      outputSchema:
        type: object
        additionalProperties: false
        required: [pattern, speed, quack]
        properties:
          pattern:
            type: string
            enum: [straight, zigzag, loop, dive, wobble]
          speed:
            type: integer
            description: 1 is a lazy glide, 10 is a rocket
          quack:
            type: string
            description: One short line for the speech bubble, max 60 characters
