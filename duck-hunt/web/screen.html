<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Hunt Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/duck-hunt/static/nes.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(300px, 24vw); }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; }
  #sky { width: 100%; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  #panel { overflow: hidden; display: flex; flex-direction: column; font-size: 10px; padding: 4px 4px 4px 0; }
  #panel .box { margin: 10px 10px 6px; padding: 10px; }
  #panel h2 { font-size: 10px; margin: 0 0 8px; color: var(--orange); font-weight: normal; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 18px; }
  #qr { background: #fff; padding: 8px; width: fit-content; margin: 6px auto; }
  #qr img, #qr canvas { display: block; width: 150px; height: 150px; image-rendering: pixelated; }
  #joinurl { text-align: center; font-size: 8px; word-break: break-all; color: var(--sky); }
  #ticker { font-size: 8px; line-height: 1.9; flex: 1; min-height: 0; overflow: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: rgba(0,0,0,.85); cursor: pointer; z-index: 5; text-align: center; gap: 24px; }
  #start .title { font-size: 48px; }
</style>
</head>
<body>
<div id="stage"><canvas id="sky" width="480" height="270" aria-label="Duck Hunt sky with every player's duck"></canvas></div>

<aside id="panel">
  <div class="box" style="text-align:center">
    <h2>SCAN TO PLAY</h2>
    <div id="qr"></div>
    <div id="joinurl"></div>
  </div>
  <div class="box">
    <h2>DUCKS</h2>
    <div class="row"><span>FLYING</span><span class="big green" id="flying">0</span></div>
    <div class="row"><span>DOWN</span><span class="big red" id="down">0</span></div>
    <div class="row muted"><span>PLAYERS</span><span id="players">0</span></div>
  </div>
  <div class="box">
    <h2>AGENT SUBSTRATE</h2>
    <div class="row"><span>SANDBOXES AWAKE</span><span class="big yellow" id="awake">--</span></div>
    <div class="muted" style="font-size:7px;margin:-4px 0 8px">IDLE DUCKS SLEEP AS SNAPSHOTS</div>
    <div class="row"><span>SNAPSHOT</span><span class="yellow" id="t-snapshot">--</span></div>
    <div class="row"><span>RESTORE</span><span class="yellow" id="t-restore">--</span></div>
    <div class="row"><span>HATCH</span><span id="t-hatch">--</span></div>
    <div class="row muted"><span>GVISOR WORKERS</span><span id="workers">--</span></div>
  </div>
  <div class="box">
    <h2>AGENTGATEWAY</h2>
    <div class="row"><span>LLM CALLS</span><span id="calls">0</span></div>
    <div class="row"><span>TOKENS</span><span id="tokens">0</span></div>
  </div>
  <div class="box" id="ticker"></div>
</aside>

<div id="start" role="button" tabindex="0">
  <div class="title">DUCK HUNT</div>
  <div class="sub">AGENT SUBSTRATE EDITION</div>
  <div class="blink">PUSH START</div>
  <div class="muted" style="font-size:8px">CLICK TO ENABLE SOUND</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/duck-hunt/static/sprites.js"></script>
<script>
// Show script errors in the ticker so a broken booth screen is easy to diagnose.
window.addEventListener("error", (e) => {
  const t = document.getElementById("ticker");
  if (t) t.insertAdjacentHTML("afterbegin", `<div class="red">ERR ${String(e.message).replace(/</g, "&lt;")} @${e.lineno}</div>`);
});
</script>
<script>
"use strict";
const W = 480, H = 270, GRASS_Y = 214, DIRT_Y = 238;
const canvas = document.getElementById("sky"), g = canvas.getContext("2d");
g.imageSmoothingEnabled = false;
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

// ---- join QR --------------------------------------------------------------
const joinURL = params.get("url") || location.origin + "/duck-hunt";
$("joinurl").textContent = joinURL.replace(/^https?:\/\//, "");
if (window.QRCode) new QRCode($("qr"), { text: joinURL, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });

$("start").onclick = $("start").onkeydown = () => { Sfx.enable(); $("start").remove(); dogIntro(); };
// Kiosk mode: ?autostart skips the title card (browsers keep sound off until a click).
if (params.has("autostart")) $("start").remove();

// ---- state ----------------------------------------------------------------
const sims = new Map();      // duck id -> sim (real ducks from the server, plus demo ducks)
const labels = [];           // floating text
let state = null, lastEventAt = null, flashUntil = 0, flashTarget = null;
let demoSeq = 0, demoNext = 0, introNext = 0;
const dog = { mode: "hidden", x: 0, y: 0, t0: 0, holding: null, queue: [] };
const gun = { angle: -1.2, recoil: 0, muzzle: 0 };
const cross = { x: W / 2, y: 90, tx: W / 2, ty: 90, on: false };
const DOG_COLORS = { B: "#c84c0c", L: "#fc9838", D: "#7c2c00", P: "#f878f8" };

function rand(a, b) { return a + Math.random() * (b - a); }
const typicalSnapshot = () => state?.timings?.snapshot?.p50 || 0;

function newSim(d, demo = false) {
  return {
    id: d.id, nick: d.nick, color: d.color, demo, mode: "fly",
    bx: rand(70, W - 70), by: rand(30, 140), dir: Math.random() < 0.5 ? -1 : 1, vyb: rand(-10, 10),
    t: rand(0, 10), x: 0, y: 0, pattern: d.pattern || "wobble", speed: d.speed || 5,
    bubble: null, pendingShot: null, aimUntil: 0, fallV: 0, shotPoseUntil: 0, shootAt: 0,
  };
}

// ---- server sync ----------------------------------------------------------
function syncState(s) {
  const seen = new Set();
  for (const d of s.ducks || []) {
    seen.add(d.id);
    let m = sims.get(d.id);
    if (!m) {
      m = newSim(d);
      if (d.state === "hatching" || d.state === "failed") { m.mode = "egg"; m.bx = rand(60, W - 140); }
      else if (d.state === "shot" || d.state === "reviving") m.mode = "down";
      sims.set(d.id, m);
    }
    m.pattern = d.flight?.pattern || m.pattern;
    m.speed = d.flight?.speed || m.speed;
    m.serverState = d.state;
    if (m.mode === "egg" && d.state === "flying") { m.mode = "rising"; m.x = m.bx; m.y = GRASS_Y; Sfx.hatch(); }
    if (m.mode === "down" && d.state === "flying") { m.mode = "rising"; m.y = GRASS_Y + 4; m.by = rand(50, 130); }
    if (m.mode === "fly" && d.state === "shot" && !m.aimUntil) { m.pendingShot = typicalSnapshot(); m.aimUntil = performance.now() + 900; }
  }
  for (const [id, m] of sims) if (!m.demo && !seen.has(id)) sims.delete(id);

  const events = s.events || [];
  if (lastEventAt === null) lastEventAt = events.length ? events[events.length - 1].at : 0;
  for (const e of events) {
    if (e.at <= lastEventAt) continue;
    lastEventAt = e.at;
    onEvent(e);
  }
  state = s;
  renderPanel(s);
}

function onEvent(e) {
  const m = sims.get(e.duckId);
  switch (e.type) {
    case "hatch":
      ticker(`<span class="green">${esc(e.nick)}</span> HATCHED IN ${fmtMs(e.ms)}`);
      break;
    case "quack":
      if (m) m.bubble = { text: e.text, until: performance.now() + 6000 };
      Sfx.quack();
      break;
    case "aim":
      if (m && m.mode === "fly" && !m.aimUntil) m.aimUntil = performance.now() + 1100;
      break;
    case "shot":
      if (m) {
        m.pendingShot = e.ms || 0;
        if (m.mode === "fly" && !m.aimUntil) m.aimUntil = performance.now() + 1100;
      }
      ticker(`<span class="red">${esc(e.nick)}</span> SHOT! SANDBOX SNAPSHOTTED${e.ms ? ` <span class="yellow">${fmtMs(e.ms)}</span>` : ""}`);
      break;
    case "revive":
      if (m) {
        if (m.mode === "down") { m.mode = "rising"; m.y = GRASS_Y + 4; m.by = rand(50, 130); }
        labels.push({ text: e.ms ? "RESTORED " + fmtMs(e.ms) : "RESTORED!", x: m.x, y: GRASS_Y - 24, until: performance.now() + 2500, color: NES.green });
      }
      Sfx.revive();
      dogLaugh(m ? m.x : W / 2);
      ticker(`<span class="green">${esc(e.nick)}</span> REVIVED! RESTORED${e.ms ? ` <span class="yellow">${fmtMs(e.ms)}</span>` : ""}`);
      break;
  }
}

// ---- the shot -------------------------------------------------------------
let demoShots = 0;
function fire(m) {
  if (m.demo) demoShots++;
  const ms = m.pendingShot;
  m.pendingShot = null; m.aimUntil = 0; cross.on = false;
  flashUntil = performance.now() + 110; flashTarget = { x: m.x, y: m.y };
  gun.recoil = 1; gun.muzzle = performance.now() + 120;
  Sfx.shot();
  m.mode = "shotpose"; m.shotPoseUntil = performance.now() + 550; m.fallV = 0; m.snapMs = ms;
  labels.push({ text: m.demo ? "BANG!" : ms ? "SNAPSHOT " + fmtMs(ms) : "SNAPSHOTTED!", x: m.x, y: m.y - 16, until: performance.now() + 2200, color: NES.yellow });
}

// ---- the dog --------------------------------------------------------------
function dogIntro() {
  if (dog.mode !== "hidden") return;
  Object.assign(dog, { mode: "walk", x: -40, y: GRASS_Y + 2, t0: performance.now() });
}
const dogX = (x) => Math.max(10, Math.min(W - 150, x + 16 - 32)); // keep the 64px dog clear of the bush/gun
function dogRetrieve(m) { dog.queue.push({ x: dogX(m.x), color: m.color, ms: m.snapMs, demo: m.demo }); }
function dogLaugh(x) { dog.queue.push({ laugh: true, x: dogX(x) }); }

function stepDog(now, dt) {
  if (dog.mode === "hidden" && dog.queue.length) {
    const job = dog.queue.shift();
    Object.assign(dog, { mode: job.laugh ? "laugh" : "hold", x: job.x, t0: now, holding: job });
    if (job.laugh) Sfx.laugh(); else Sfx.gotcha();
  }
  const age = (now - dog.t0) / 1000;
  switch (dog.mode) {
    case "walk": {
      const stopX = W * 0.32;
      if (dog.x < stopX) {
        dog.x += 48 * dt;
        if (Math.floor(age * 6) !== Math.floor((age - dt) * 6)) Sfx.walk();
      } else if (!dog.stopAt) { dog.stopAt = now; Sfx.bark(); }
      else if (now - dog.stopAt > 700) { dog.mode = "jump"; dog.t0 = now; dog.jx = dog.x; dog.stopAt = 0; }
      break;
    }
    case "jump": {
      const p = Math.min(1, age / 0.9);
      dog.x = dog.jx + p * 70;
      dog.y = GRASS_Y + 2 - Math.sin(p * Math.PI) * 70 + p * 50;
      if (p >= 1) dog.mode = "hidden";
      break;
    }
    case "hold":
    case "laugh":
      if (age > 2.6) dog.mode = "hidden";
      break;
  }
}

// Outlined block drawing: every part gets a 1px black outline, like NES sprites.
function parts(x, y, list, flip = false, width = 34) {
  const R = list.map(([rx, ry, rw, rh, c]) => [flip ? width - rx - rw : rx, ry, rw, rh, c]);
  for (const [rx, ry, rw, rh, c] of R) if (c !== NES.black && c !== "noline") block(x + rx - 1, y + ry - 1, rw + 2, rh + 2, NES.black);
  for (const [rx, ry, rw, rh, c] of R) block(x + rx, y + ry, rw, rh, c === "noline" ? NES.black : c);
}

function drawDogSide(x, y, now, pose) {
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(2, 2); x = 0; y = 0;
  const { B, L, D } = DOG_COLORS;
  const step = Math.floor(now / 140) % 2, sniff = pose === "walk" && Math.floor(now / 300) % 2;
  const hy = sniff ? 3 : 0;
  const legs = pose === "jump"
    ? [[24, 13, 7, 3, B], [-1, 13, 7, 3, B]]
    : step ? [[5, 16, 3, 5, B], [10, 16, 3, 4, B], [17, 16, 3, 4, B], [22, 16, 3, 5, B]]
           : [[6, 16, 3, 4, B], [9, 16, 3, 5, B], [18, 16, 3, 5, B], [21, 16, 3, 4, B]];
  parts(x, y, [
    [0, 5, 3, 2, B], [2, 7, 3, 3, B],                 // tail
    ...legs,
    [4, 8, 20, 9, B], [8, 14, 12, 3, L],              // body, belly
    [20, 4 + hy, 6, 7, B], [21, 0 + hy, 9, 9, B],     // neck, head
    [28, 4 + hy, 6, 5, L], [33, 4 + hy, 2, 2, "noline"], // snout, nose
    [20, 1 + hy, 3, 10, D],                           // ear
    [25, 2 + hy, 2, 2, "noline"],                     // eye
  ], false, 36);
  g.restore();
}

function drawDogFront(x, y, now, laugh) {
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(2, 2); x = 0; y = 0;
  const { B, L, D, P } = DOG_COLORS;
  const bob = laugh ? Math.round(Math.sin(now / 70) * 1.5) : 0;
  y += bob;
  const face = laugh
    ? [[10, 7, 3, 1, "noline"], [19, 7, 3, 1, "noline"], [12, 12, 8, 3, "noline"], [14, 14, 4, 1, P]]
    : [[10, 5, 3, 3, NES.white], [19, 5, 3, 3, NES.white], [11, 6, 2, 2, "noline"], [20, 6, 2, 2, "noline"], [13, 14, 6, 1, "noline"]];
  parts(x, y, [
    [8, 16, 16, 16, B], [12, 18, 8, 12, L],               // body, chest
    [3, 3, 5, 12, D], [24, 3, 5, 12, D],                  // ears
    [7, 1, 18, 15, B], [10, 9, 12, 7, L],                 // head, muzzle
    [14, 9, 4, 3, "noline"],                              // nose
    ...face,
    ...(laugh ? [[4, 20, 4, 8, B], [24, 20, 4, 8, B]] : [[25, 8, 5, 12, B], [25, 5, 5, 4, L]]), // arms
  ], false, 32);
  if (!laugh && dog.holding) drawSprite(g, duckSprite("shot", dog.holding.color), x + 22, y - 10, false, true, 1);
  g.restore();
}

function drawDog(now) {
  if (dog.mode === "walk" || dog.mode === "jump") {
    drawDogSide(dog.x, dog.y - 42, now, dog.mode);
    if (dog.mode === "walk" && dog.stopAt) text("!", dog.x + 52, dog.y - 62, NES.white, "center", 12);
  }
}

// The dog pops up behind the grass, so it is drawn before the grass.
function drawDogPopup(now) {
  if (dog.mode !== "hold" && dog.mode !== "laugh") return;
  const age = (now - dog.t0) / 1000;
  const rise = age < 0.35 ? age / 0.35 : age > 2.25 ? Math.max(0, (2.6 - age) / 0.35) : 1;
  const y = GRASS_Y + 8 - rise * 72;
  drawDogFront(dog.x, y, now, dog.mode === "laugh");
  if (rise === 1) {
    const h = dog.holding;
    const msg = dog.mode === "laugh" ? "HA HA! IT GOT AWAY!" : h?.demo ? "GOTCHA!" : h?.ms ? "SNAPSHOT " + fmtMs(h.ms) : "GOTCHA!";
    text(msg, dog.x + 32, y - 34, NES.white, "center", 8);
  }
}

// ---- the light gun --------------------------------------------------------
const GUN_X = W - 26, GUN_Y = H + 6;

function drawGun(now) {
  const target = cross.on ? Math.atan2(cross.y - GUN_Y, cross.x - GUN_X) + Math.PI / 2 : -0.35;
  gun.angle += (target - gun.angle) * 0.15;
  gun.recoil = Math.max(0, gun.recoil - 0.08);
  g.save();
  g.translate(GUN_X, GUN_Y + gun.recoil * 8);
  g.rotate(gun.angle);
  const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  // outline, then fill: barrel, body, grip, trigger guard
  r(-6, -66, 12, 44, NES.black); r(-12, -24, 24, 22, NES.black); r(-9, -4, 18, 34, NES.black);
  r(-4, -64, 8, 40, "#7c7c7c"); r(-4, -64, 3, 40, NES.gray);
  r(-3, -66, 6, 3, "#3c3c3c");
  r(-10, -22, 20, 18, NES.orange); r(-10, -22, 20, 4, "#fcbc78");
  r(-7, -4, 14, 32, NES.orange); r(-7, -4, 4, 32, "#fcbc78");
  r(6, -2, 8, 10, NES.black); r(8, 0, 4, 6, "#5c5c5c");
  if (now < gun.muzzle) {
    r(-10, -82, 20, 14, NES.yellow); r(-5, -90, 10, 26, NES.white); r(-14, -77, 28, 4, NES.white);
  }
  g.restore();
}

function drawCrosshair(now) {
  if (!cross.on) return;
  cross.x += (cross.tx - cross.x) * 0.2;
  cross.y += (cross.ty - cross.y) * 0.2;
  const r = 13 + 2 * Math.sin(now / 60), c = NES.red, x = cross.x, y = cross.y;
  g.strokeStyle = c; g.lineWidth = 2;
  g.strokeRect(Math.round(x - r), Math.round(y - r), Math.round(r * 2), Math.round(r * 2));
  block(x - r - 7, y - 1, 9, 2, c); block(x + r - 2, y - 1, 9, 2, c);
  block(x - 1, y - r - 7, 2, 9, c); block(x - 1, y + r - 2, 2, 9, c);
  block(x - 1, y - 1, 2, 2, c);
}

// ---- demo ducks (attract mode) --------------------------------------------
const COLORS = Object.keys(DUCK_COLORS), PATTERNS = ["straight", "zigzag", "loop", "dive", "wobble"];

function stepDemo(now) {
  const real = [...sims.values()].filter((m) => !m.demo &&
    (["fly", "egg", "rising", "shotpose", "falling"].includes(m.mode) || m.serverState === "reviving"));
  const demos = [...sims.values()].filter((m) => m.demo);
  if (real.length) {
    for (const m of demos) if (m.mode === "fly" || m.mode === "rising") m.mode = "flyaway";
    return;
  }
  if (now > introNext && dog.mode === "hidden" && !demos.length) { dogIntro(); introNext = now + 75000; demoNext = now + 3200; return; }
  if (now > demoNext && dog.mode !== "walk" && dog.mode !== "jump" && demos.filter((m) => m.mode !== "down").length < 2) {
    const id = "demo-" + ++demoSeq;
    const m = newSim({ id, nick: "DEMO", color: COLORS[demoSeq % COLORS.length], pattern: PATTERNS[demoSeq % PATTERNS.length], speed: 4 + (demoSeq % 6) }, true);
    m.mode = "rising"; m.x = m.bx = rand(80, W - 160); m.y = GRASS_Y; m.shootAt = now + rand(3500, 6000);
    sims.set(id, m);
    demoNext = now + rand(2500, 4500);
  }
  for (const m of demos) {
    if (m.mode === "fly" && m.shootAt && now > m.shootAt) { m.shootAt = 0; m.pendingShot = 0; m.aimUntil = now + 1100; }
    if (m.mode === "down" && dog.mode === "hidden" && !dog.queue.length) sims.delete(m.id);
  }
}

// ---- duck motion ----------------------------------------------------------
function step(m, dt, now) {
  m.t += dt;
  const base = 24 + m.speed * 9;
  if (m.mode === "fly" || m.mode === "rising") {
    m.bx += m.dir * base * dt;
    if (m.bx < 24) { m.bx = 24; m.dir = 1; }
    if (m.bx > W - 44) { m.bx = W - 44; m.dir = -1; }
    m.by += m.vyb * dt;
    if (m.by < 24 || m.by > 140) { m.vyb = -m.vyb; m.by = Math.max(24, Math.min(140, m.by)); }
    let ox = 0, oy = 0;
    const t = m.t;
    switch (m.pattern) {
      case "straight": oy = 3 * Math.sin(t); break;
      case "zigzag": oy = 26 * (2 * Math.abs(((t * 1.3) % 2) - 1) - 1); break;
      case "loop": ox = 22 * Math.cos(t * 3) * m.dir; oy = 22 * Math.sin(t * 3); break;
      case "dive": oy = 46 * Math.pow(Math.sin(t * 1.4), 3); break;
      default: oy = 4 * Math.sin(t * 7) + 10 * Math.sin(t * 1.3);
    }
    const tx = m.bx + ox, ty = m.by + oy;
    if (m.mode === "rising") {
      m.x += (tx - m.x) * Math.min(1, dt * 3); m.y += (ty - m.y) * Math.min(1, dt * 3);
      if (Math.abs(m.y - ty) < 2) m.mode = "fly";
    } else { m.x = tx; m.y = ty; }
    if (m.aimUntil) {
      cross.on = true; cross.tx = m.x + 16; cross.ty = m.y + 12;
      if (now > m.aimUntil && m.pendingShot != null) fire(m);
    }
  } else if (m.mode === "flyaway") {
    m.t += dt; m.x += m.dir * 60 * dt; m.y -= 90 * dt;
    if (m.y < -40) sims.delete(m.id);
  } else if (m.mode === "shotpose") {
    if (now > m.shotPoseUntil) { m.mode = "falling"; Sfx.fall(); }
  } else if (m.mode === "falling") {
    m.fallV = Math.min(m.fallV + 230 * dt, 170);
    m.y += m.fallV * dt;
    if (m.y > GRASS_Y + 6) { m.mode = "down"; dogRetrieve(m); }
  }
}

// ---- scenery --------------------------------------------------------------
function block(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

function circle(cx, cy, r, c) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y += 2) {
    const w = Math.round(Math.sqrt(r * r - y * y));
    g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 2);
  }
}

function drawTree() {
  block(44, 96, 14, GRASS_Y - 96, NES.trunk);
  block(36, 150, 8, 6, NES.trunk); block(58, 128, 10, 6, NES.trunk);
  const blobs = [[50, 70, 30], [30, 88, 22], [72, 90, 22], [50, 100, 24], [20, 110, 14], [82, 112, 14]];
  for (const [cx, cy, r] of blobs) circle(cx, cy, r + 2, NES.grassDark);
  for (const [cx, cy, r] of blobs) circle(cx, cy, r, NES.grassMid);
  for (const [cx, cy, r] of blobs) circle(cx - r / 3, cy - r / 3, r / 3, NES.grass);
}

function drawBush() {
  const blobs = [[420, 200, 18], [444, 194, 22], [466, 204, 16], [400, 208, 12]];
  for (const [cx, cy, r] of blobs) circle(cx, cy, r + 2, NES.grassDark);
  for (const [cx, cy, r] of blobs) circle(cx, cy, r, NES.grassMid);
}

function drawGrass() {
  for (let x = 0; x < W; x += 4) {
    const h = 10 + ((x * 7) % 13);
    block(x, GRASS_Y - h, 4, h + 30, (x / 4) % 3 === 0 ? NES.grassMid : NES.grass);
    block(x + 1, GRASS_Y - h, 2, 3, NES.grassDark);
  }
  block(0, GRASS_Y, W, DIRT_Y - GRASS_Y, NES.grassMid);
  block(0, DIRT_Y, W, H - DIRT_Y, NES.dirt);
  for (let x = 3; x < W; x += 17) block(x, DIRT_Y + 4 + (x % 5), 3, 2, NES.dirtDark);
}

function text(str, x, y, color = NES.white, align = "left", size = 8) {
  g.font = `${size}px "Press Start 2P"`;
  g.textAlign = align; g.textBaseline = "top";
  g.fillStyle = NES.black; g.fillText(str, Math.round(x) + 1, Math.round(y) + 1);
  g.fillStyle = color; g.fillText(str, Math.round(x), Math.round(y));
}

function wrap(str, max) {
  const words = String(str).toUpperCase().split(/\s+/), lines = [];
  let line = "";
  for (const w of words) {
    if ((line + " " + w).trim().length > max) { if (line) lines.push(line); line = w; }
    else line = (line + " " + w).trim();
  }
  if (line) lines.push(line);
  return lines.slice(0, 3);
}

function drawBubble(m, now) {
  if (!m.bubble || now > m.bubble.until) return;
  const lines = wrap(m.bubble.text, 18), w = Math.max(...lines.map((l) => l.length)) * 6 + 10, h = lines.length * 9 + 8;
  let bx = Math.min(Math.max(m.x + 16 - w / 2, 2), W - w - 2), by = m.y - h - 14;
  if (by < 2) by = m.y + 26;
  block(bx - 1, by - 1, w + 2, h + 2, NES.black);
  block(bx, by, w, h, NES.white);
  g.font = '6px "Press Start 2P"'; g.textAlign = "left"; g.textBaseline = "top"; g.fillStyle = NES.black;
  lines.forEach((l, i) => g.fillText(l, Math.round(bx + 5), Math.round(by + 5 + i * 9)));
}

function drawDuck(m, now) {
  const flip = m.dir < 0;
  if (m.mode === "fly" || m.mode === "rising" || m.mode === "flyaway") {
    const frame = FLAP[Math.floor(m.t * (6 + m.speed)) % FLAP.length];
    drawSprite(g, duckSprite(frame, m.color), m.x, m.y, flip, false, 2);
    text(m.nick.toUpperCase(), m.x + 16, m.y - 9, m.demo ? NES.gray : NES.white, "center", 6);
  } else if (m.mode === "shotpose") {
    drawSprite(g, duckSprite("shot", m.color), m.x, m.y, false, false, 2);
  } else if (m.mode === "falling") {
    drawSprite(g, duckSprite("shot", m.color), m.x, m.y, Math.floor(now / 120) % 2 === 0, true, 2);
  }
}

function drawHUD(s) {
  const real = s?.ducks || [];
  const ducks = real.length ? real : [...sims.values()].filter((m) => m.demo)
    .map((m) => ({ shots: 0, quacks: 0, revives: 0, state: m.mode === "fly" || m.mode === "rising" ? "flying" : "shot" }));
  const shots = real.length ? real.reduce((n, d) => n + d.shots, 0) : demoShots;
  const score = ducks.reduce((n, d) => n + d.quacks * 100 + d.revives * 500 + (d.state === "flying" ? 50 : 0), 0);
  const y = DIRT_Y + 6;
  const box = (x, w) => { block(x, y, w, 22, NES.black); g.strokeStyle = NES.green; g.lineWidth = 1; g.strokeRect(x + 1.5, y + 1.5, w - 3, 19); };
  box(10, 70); text("SHOT", 18, y + 4, NES.sky, "left", 6); text(String(shots), 18, y + 12, NES.white, "left", 6);
  box(90, 230); text("HIT", 98, y + 8, NES.green, "left", 6);
  ducks.slice(0, 24).forEach((d, i) => {
    const down = d.state === "shot" || d.state === "reviving";
    block(124 + i * 8, y + 8, 6, 6, down ? NES.red : d.state === "flying" ? NES.white : NES.gray);
  });
  box(330, 70); text(String(real.length ? score : demoShots * 500).padStart(6, "0"), 338, y + 4, NES.white, "left", 6); text("SCORE", 338, y + 12, NES.white, "left", 6);
}

// ---- frame loop -----------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  stepDemo(now);
  for (const m of [...sims.values()]) step(m, dt, now);
  stepDog(now, dt);
  if (![...sims.values()].some((m) => m.aimUntil)) cross.on = false;

  if (now < flashUntil) {
    // The classic zapper frame: black screen, white box where the duck is.
    block(0, 0, W, H, NES.black);
    if (flashTarget) block(flashTarget.x - 4, flashTarget.y - 4, 40, 32, NES.white);
  } else {
    block(0, 0, W, H, NES.sky);
    drawTree();
    for (const m of sims.values()) drawDuck(m, now);
    drawDogPopup(now);
    drawGrass();
    drawBush();
    drawDog(now);
    for (const m of sims.values()) {
      if (m.mode === "egg") {
        const wob = Math.sin(now / 90) * 1.5;
        drawSprite(g, eggSprite(m.color), m.bx + wob, GRASS_Y + 8, false, false, 1.5);
        text(m.nick.toUpperCase(), m.bx + 7, GRASS_Y - 2, NES.white, "center", 6);
      }
      if (m.mode === "down" && m.serverState === "reviving") {
        for (let i = 0; i < 4; i++) block(m.x + rand(-6, 22), GRASS_Y + rand(-14, 6), 2, 2, NES.yellow);
      }
    }
    for (const m of sims.values()) if (m.mode === "fly") drawBubble(m, now);
    drawCrosshair(now);
    for (let i = labels.length - 1; i >= 0; i--) {
      const l = labels[i];
      if (now > l.until) { labels.splice(i, 1); continue; }
      text(l.text, Math.max(50, Math.min(W - 50, l.x + 16)), l.y - (2200 - (l.until - now)) / 100, l.color, "center", 8);
    }
    drawHUD(state);
    drawGun(now);
    if (![...sims.values()].some((m) => !m.demo)) {
      if (Math.floor(now / 600) % 2) text("SCAN THE QR CODE TO HATCH", W / 2 - 40, 14, NES.white, "center", 8);
      text("YOUR OWN AI DUCK!", W / 2 - 40, 26, NES.yellow, "center", 8);
    }
  }
  requestAnimationFrame(frame);
}

// ---- side panel -----------------------------------------------------------
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]).toUpperCase(); }

function ticker(html) {
  const el = $("ticker"), div = document.createElement("div");
  div.innerHTML = html;
  el.prepend(div);
  while (el.children.length > 14) el.lastChild.remove();
}

function pct(t) { return t ? `${fmtMs(t.p50)}<span class="muted"> P95 ${fmtMs(t.p95)}</span>` : "--"; }

function renderPanel(s) {
  const ducks = s.ducks || [];
  $("flying").textContent = ducks.filter((d) => d.state === "flying").length;
  $("down").textContent = ducks.filter((d) => d.state === "shot" || d.state === "reviving").length;
  $("players").textContent = s.players;
  $("t-snapshot").innerHTML = pct(s.timings.snapshot);
  $("t-restore").innerHTML = pct(s.timings.restore);
  $("t-hatch").innerHTML = pct(s.timings.hatch);
  const sub = s.substrate || {};
  $("awake").textContent = sub.actors != null ? `${sub.running}/${ducks.length}` : "--";
  $("workers").textContent = sub.workers != null ? `${sub.busyWorkers}/${sub.workers}` : "--";
  $("calls").textContent = s.llmCalls;
  $("tokens").textContent = (s.tokens.inputTokens + s.tokens.outputTokens).toLocaleString();
}

document.fonts.load('8px "Press Start 2P"').finally(() => {
  connectState(syncState);
  requestAnimationFrame(frame);
  if (params.has("autostart")) dogIntro();
  introNext = performance.now() + 75000;
  demoNext = performance.now() + 3500;
});
</script>
</body>
</html>
