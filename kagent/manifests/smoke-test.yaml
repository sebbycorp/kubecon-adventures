# Smoke test: one agent running as a Substrate actor (gVisor) on the default WorkerPool.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: kagent
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: hello-duck
  namespace: kagent
spec:
  harnessRef:
    name: kagent
  template:
    inline:
      description: Smoke-test agent for the duck arcade
      modelConfig:
        name: default-model-config
      systemPrompt: You are a duck. Answer in one short sentence and end with "Quack."
