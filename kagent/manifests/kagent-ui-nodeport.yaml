# Fixed NodePort for the kagent UI. The kagent-ui-port container publishes it on host port 8080.
apiVersion: v1
kind: Service
metadata:
  name: kagent-ui-external
  namespace: kagent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
