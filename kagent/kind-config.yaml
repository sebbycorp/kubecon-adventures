# kind cluster for kagent + Agent Substrate + agentgateway.
# Based on kagent's scripts/kind/kind-config.yaml (v1.0.0-alpha17).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kagent
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
networking:
  apiServerAddress: "127.0.0.1"
# Substrate WorkerPools project pod identities and trust bundles into ateom.
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  "api/alpha": "false"
  "certificates.k8s.io/v1beta1": "true"
# One control plane and two workers, so agents spread across nodes.
# All nodes share this host's CPU and RAM; kind sets no per-node limits.
nodes:
  - role: control-plane
  - role: worker
  - role: worker
